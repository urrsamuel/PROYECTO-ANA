<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Administrar catálogo</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="crud.css">
</head>
<body>
  <header>
    <h1>Administrar catálogo</h1>
    <nav class="filtros">
      <button onclick="window.location.href='index.html'">Regresar al catálogo</button>
    </nav>
  </header>

  <!-- Formulario de gestión: Crear -->
  <section class="seccion-gestion">
    <h2>Agregar producto</h2>
    <form>
      <label for="nombre-producto">Nombre del accesorio</label>
      <input type="text" id="nombre-producto" placeholder="Ej: Manilla Azul">

      <label for="categoria-producto">Categoría</label>
      <select id="categoria-producto">
        <option>Manillas</option>
        <option>Cadenas</option>
        <option>Collares</option>
      </select>

      <label for="precio-producto">Precio</label>
      <input type="number" id="precio-producto" placeholder="Ej: 25000">

      <label for="imagen-producto">Imagen</label>
      <input type="file" id="imagen-producto">

      <button type="submit">Agregar</button>
    </form>
  </section>

  <!-- Formulario de gestión: Editar -->
  <section class="seccion-gestion">
    <h2>Editar producto</h2>
    <form>
      <label for="id-edicion">Número de producto</label>
      <input type="text" id="id-edicion" placeholder="Ej: 1">

      <label for="nombre-edicion">Nuevo nombre</label>
      <input type="text" id="nombre-edicion" placeholder="Ej: Manilla Roja">

      <label for="categoria-edicion">Nueva categoría</label>
      <select id="categoria-edicion">
        <option>Manillas</option>
        <option>Cadenas</option>
        <option>Collares</option>
      </select>

      <label for="precio-edicion">Nuevo precio</label>
      <input type="number" id="precio-edicion" placeholder="Ej: 30000">

      <label for="imagen-edicion">Nueva imagen</label>
      <input type="file" id="imagen-edicion">

      <button type="submit">Actualizar</button>
    </form>
  </section>

  <!-- Formulario de gestión: Eliminar -->
  <section class="seccion-gestion">
    <h2>Eliminar producto</h2>
    <form>
      <label for="id-eliminar">Número de producto</label>
      <input type="text" id="id-eliminar" placeholder="Ej: 1">

      <button type="submit" class="boton-eliminar">Eliminar</button>
    </form>
  </section>

  <footer>
    <p>© 2026 Anneta Accesorios</p>
  </footer>
</body>
</html>
